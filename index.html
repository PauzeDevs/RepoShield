<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0c">
  <meta name="description" content="RepoShield presents the immersive KIBORI ThreeUI experience, with the original repository scanner available separately.">
  <meta property="og:title" content="RepoShield — KIBORI Experience">
  <meta property="og:description" content="An immersive ThreeUI landing page experience.">
  <meta property="og:type" content="website">
  <title>RepoShield — KIBORI Experience</title>
  <link rel="canonical" href="https://reposhield.devs.surf/">
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090a0c; }
    .experience { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #090a0c; }
    .scanner-link { position: fixed; z-index: 10; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: inline-flex; align-items: center; gap: 9px; padding: 11px 15px; border: 1px solid rgba(255,255,255,.19); border-radius: 999px; color: #f4f2ed; background: rgba(12,13,15,.82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: .01em; box-shadow: 0 8px 30px rgba(0,0,0,.25); transition: background .2s ease, border-color .2s ease, transform .2s ease; }
    .scanner-link:hover, .scanner-link:focus-visible { background: rgba(35,37,39,.95); border-color: rgba(255,255,255,.42); transform: translateY(-2px); outline: none; }
    .scanner-link span { color: #b7c6ff; }
    .fallback { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; padding: 28px; text-align: center; color: #f4f2ed; background: #090a0c; }
    .fallback h1 { margin: 0; font-size: clamp(24px, 4vw, 40px); }
    .fallback p { max-width: 560px; margin: 0 auto; color: #b5b6bb; line-height: 1.6; }
    .fallback a { color: #d5ddff; }
    @media (max-width: 480px) { .scanner-link { right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); padding: 10px 13px; font-size: 12px; } }
    @media (prefers-reduced-motion: reduce) { .scanner-link { transition: none; } }
  </style>
</head>
<body>
  <iframe
    class="experience"
    title="KIBORI immersive ThreeUI landing page"
    src="https://threeui.com/landing-pages/kibori.html"
    allow="fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
    loading="eager"
  ></iframe>
  <a class="scanner-link" href="./scanner.html" aria-label="Open the RepoShield security scanner"><span aria-hidden="true">↗</span> RepoShield Scanner</a>
  <noscript>
    <div class="fallback">
      <h1>KIBORI experience</h1>
      <p>This immersive experience is hosted by ThreeUI and requires JavaScript. You can still use RepoShield's original scanner.</p>
      <a href="./scanner.html">Open RepoShield Scanner</a>
      <a href="https://threeui.com/landing-pages/kibori">View the original ThreeUI preview</a>
    </div>
  </noscript>
</body>
</html>
