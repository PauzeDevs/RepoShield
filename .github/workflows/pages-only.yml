name: Static site checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reposhield-checks
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Pages source
        run: |
          test -s index.html
          test -s browser-scan.js
          test -s scanner-core.js
          test -s tests/scanner-core.test.cjs
          test -s assets/styles.css
          test -s assets/shield.svg
          test -s CNAME
          test "$(tr -d '\r\n' < CNAME)" = "reposhield.devs.surf"
          node --check browser-scan.js
          node --check scanner-core.js
          node --test tests/scanner-core.test.cjs
