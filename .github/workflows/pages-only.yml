name: Static site checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reposhield-checks
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Pages source
        run: |
          test -s index.html
          test -s browser-scan.js
          test -s scanner-core.js
          test -s advanced-rules.js
          test -s tools/reposhield-ci.cjs
          test -s .github/workflows/reposhield-scan.yml
          test -s .github/workflows/self-scan.yml
          test -s tests/scanner-core.test.cjs
          test -s tests/advanced-rules.test.cjs
          test -s assets/styles.css
          test -s assets/threeui-motion.css
          test -s assets/ambient-field.js
          test -s assets/threeui-interaction.js
          test -s assets/shield.svg
          test -s CNAME
          test "$(tr -d '\r\n' < CNAME)" = "reposhield.devs.surf"
          node --check browser-scan.js
          node --check scanner-core.js
          node --check advanced-rules.js
          node --check assets/ambient-field.js
          node --check assets/threeui-interaction.js
          node --check tools/reposhield-ci.cjs
          node --test tests/scanner-core.test.cjs tests/advanced-rules.test.cjs
