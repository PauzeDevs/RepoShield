name: Deploy RepoShield to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run scanner tests
        run: pytest -q
      - name: Check required files
        run: |
          test -s index.html
          test -s config.js
          test -s app.js
          test -s assets/styles.css
          test -s backend/main.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
      - name: Check frontend references
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          for asset in ("assets/styles.css", "assets/shield.svg", "config.js", "app.js"):
              assert Path(asset).is_file(), f"Missing referenced asset: {asset}"
          assert 'id="scan-form"' in html
          print("Static site references look good.")
          PY
      - name: Verify deployed API health
        env:
          API_BASE: https://reposhield-api-production.up.railway.app
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$API_BASE/health" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("status") == "ok", data; print("RepoShield API health check passed.")'
  deploy:
    name: Publish website
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
